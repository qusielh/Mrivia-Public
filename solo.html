<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Solo Minele</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Quicksand:wght@500;600;700&family=Silkscreen&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-pixel: "Silkscreen", system-ui, sans-serif;
            --font-display: "Fredoka", "Quicksand", system-ui, sans-serif;
            --font-sans: "Quicksand", system-ui, sans-serif;
            --background: #140811;
            --foreground: oklch(0.98 0.01 90);
            --sakura: oklch(0.82 0.14 355);
            --bright-rose: #ff4081;
            --gold: oklch(0.84 0.16 82);
            --diamond: #4dede2;
            --redstone: oklch(0.62 0.22 28);
        }

        body {
            background-color: var(--background);
            background: linear-gradient(135deg, #180915 0%, #291124 50%, #11050e 100%);
            color: var(--foreground);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            margin: 0;
            position: relative;
        }

        .hero-bg {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -3;
            background: linear-gradient(135deg, #1a0b16 0%, #2a1125 100%);
        }

        .hero-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(20, 12, 18, 0.35), rgba(20, 12, 18, 0.88));
            z-index: -2;
            pointer-events: none;
        }

        .sakura-fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .sakura-petal {
            position: absolute;
            top: -20px;
            display: block;
            opacity: 0.85;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) translateX(0) rotate(var(--rot-start));
                opacity: 0.85;
            }

            100% {
                transform: translateY(105vh) translateX(var(--drift)) rotate(calc(var(--rot-start) + 360deg));
                opacity: 0;
            }
        }

        header {
            background: rgba(15, 8, 13, 0.45);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .header-center-title {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            margin: 0;
            white-space: nowrap;
            font-family: var(--font-display);
        }

        .mc-btn-gray {
            background: linear-gradient(180deg, #4e4e4e 0%, #2d2d2d 100%);
            border: 2px solid #1c1c1c;
            box-shadow: inset -2px -2px 0 #141414, inset 2px 2px 0 #777;
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: filter 0.1s ease;
            outline: none !important;
        }

            .mc-btn-gray:hover {
                filter: brightness(1.15);
                color: #fff;
            }

        .mc-btn-action {
            background: linear-gradient(180deg, #3d2235 0%, #22101e 100%);
            border: 1px solid rgba(255, 183, 197, 0.35);
            color: var(--sakura);
            font-family: var(--font-pixel);
            font-size: 0.72rem;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            outline: none !important;
        }

            .mc-btn-action:hover {
                border-color: var(--diamond);
                color: #ffffff;
                background: rgba(77, 237, 226, 0.15);
            }

        .font-pixel {
            font-family: var(--font-pixel) !important;
            letter-spacing: 0.05em;
        }

        /* 🌸 SCREENSHOT-PERFECT TOP STATS ROW */
        .hud-stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 380px;
            margin-bottom: 0.85rem;
            padding: 0 4px;
        }

        /* Wordle Board Matrix */
        .wordle-matrix-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .wordle-row {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: center;
        }

        .wordle-cell {
            flex: 1;
            aspect-ratio: 1 / 1;
            max-width: 62px;
            background: rgba(28, 14, 24, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-pixel) !important;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 1.45rem;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.6);
        }

            .wordle-cell.correct {
                background: #27ae60 !important;
                border-color: #2ecc71 !important;
                box-shadow: 0 0 12px rgba(46, 204, 113, 0.45);
            }

            .wordle-cell.present {
                background: #f39c12 !important;
                border-color: #f1c40f !important;
                box-shadow: 0 0 12px rgba(241, 196, 15, 0.45);
            }

            .wordle-cell.absent {
                background: #2c3e50 !important;
                border-color: #34495e !important;
                opacity: 0.55;
            }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }

            20%, 60% {
                transform: translateX(-8px);
            }

            40%, 80% {
                transform: translateX(8px);
            }
        }

        .shake-row {
            animation: shake 0.4s ease-in-out;
        }

        /* 🌸 RESULT NOTIFICATION BANNER */
        .result-banner-box {
            display: none;
            width: 100%;
            max-width: 380px;
            margin-top: 1rem;
            padding: 0.9rem 1.1rem;
            border-radius: 14px;
            text-align: center;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-banner-box.win {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.25), rgba(77, 237, 226, 0.2));
            border: 2px solid var(--diamond);
            box-shadow: 0 0 20px rgba(77, 237, 226, 0.25);
        }

        .result-banner-box.loss {
            background: linear-gradient(135deg, rgba(231, 76, 60, 0.25), rgba(20, 10, 18, 0.8));
            border: 2px solid var(--redstone);
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.25);
        }

        /* Toast Notice for Invalid Words */
        .toast-banner {
            position: fixed;
            top: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(220, 53, 69, 0.95);
            color: #ffffff;
            padding: 7px 18px;
            border-radius: 8px;
            font-family: var(--font-pixel);
            font-size: 0.72rem;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
        }

        #rotatePromptOverlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(14, 6, 12, 0.97);
            backdrop-filter: blur(16px);
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .rotate-phone-animation {
            width: 60px;
            height: 60px;
            margin-bottom: 1.5rem;
            animation: rotateDevice 2.4s ease-in-out infinite alternate;
        }

        @keyframes rotateDevice {
            0%, 40% {
                transform: rotate(0deg);
            }

            70%, 100% {
                transform: rotate(90deg);
            }
        }

        @media (max-width: 1024px) and (orientation: portrait) {
            #rotatePromptOverlay {
                display: flex !important;
            }
        }
    </style>
</head>
<body>

    <!-- 📱 ROTATE SCREEN SHIELD (Mobile Portrait) -->
    <div id="rotatePromptOverlay">
        <svg class="rotate-phone-animation" viewBox="0 0 24 24" fill="none" stroke="var(--sakura)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2" />
            <path d="M12 18h.01" />
        </svg>
        <span class="font-pixel text-sakura small d-block mb-2">🌸 LANDSCAPE MODE REQUIRED 🌸</span>
        <h2 class="fs-4 fw-bold text-white mb-2" style="font-family: var(--font-display);">Please Rotate Your Device</h2>
        <p class="text-white-50 small mb-0" style="max-width: 320px; font-family: var(--font-sans);">
            Turn your phone sideways to play Solo Minele!
        </p>
    </div>

    <img src="assets/sakura-13.jpg" class="hero-bg" onerror="this.src='assets/sakura-3.jpg'">
    <div class="hero-overlay"></div>
    <div class="sakura-fx" id="soloLeavesContainer"></div>

    <div id="toastNotice" class="toast-banner">Invalid Word</div>

    <header class="w-100 p-3 px-4 flex-shrink-0">
        <h2 class="fs-5 fw-bold text-white mb-0 header-center-title">Solo Minele</h2>
        <div class="d-flex align-items-center justify-content-between w-100">
            <h1 class="font-pixel mb-0" style="color: var(--bright-rose); font-size: 1.2rem;">Minele</h1>
            <div>
                <button onclick="leaveArena()" class="mc-btn-gray font-pixel">Leave Arena</button>
            </div>
        </div>
    </header>

    <main class="container my-auto py-3 py-lg-4 d-flex flex-column align-items-center justify-content-center flex-grow-1">

        <!-- 📸 SCREENSHOT-PERFECT TOP STATS ROW -->
        <div class="hud-stats-bar">
            <span id="attemptCounterText" class="font-pixel text-white-50 small" style="font-size: 0.75rem;">ATTEMPT 1 / 5</span>
            <span class="font-pixel text-diamond small" id="userScoreBadge" style="font-size: 0.75rem;">0 PTS</span>
        </div>

        <!-- 🌸 WORDLE GRID (100% visible, never obstructed) -->
        <div class="wordle-matrix-container" id="wordleGridBox"></div>

        <!-- Subtle Under-Grid Action -->
        <div id="underGridActionBox" class="mt-3 text-center" style="width: 100%; max-width: 380px;">
            <button onclick="pickNextWordDirect()" class="mc-btn-action font-pixel" style="font-size: 0.7rem; opacity: 0.75;">
                Skip to New Word
            </button>
        </div>

        <!-- 🌸 NON-BLOCKING RESULT NOTIFICATION -->
        <div id="resultBanner" class="result-banner-box">
            <div id="resultHeadline" class="font-pixel fs-6 mb-1">✦ OUTSTANDING DECODE ✦</div>
            <div id="resultDetail" class="text-white small mb-2">You gained +100 points!</div>
            <button onclick="pickNextWordDirect()" class="mc-btn-action" id="nextWordBtn" style="font-size: 0.75rem;">Next Word →</button>
        </div>

    </main>

    <script>
        const LOCAL_STORAGE_KEY = 'mt_solo_minele_state';
        const STREAK_KEY = 'mt_solo_solve_streak';

        let cachedDictionary = null;
        let currentUserScore = 0;
        let gameState = {
            targetWord: "",
            wordLength: 5,
            totalAttempts: 5,
            currentRow: 0,
            currentInput: "",
            attempts: [],
            isCompleted: false,
            isWon: false,
            pointsAwarded: false
        };

        function leaveArena() {
            window.location.href = 'lobby.html';
        }

        // Global focus release: clicking any button immediately releases focus to the window
        document.addEventListener('click', (e) => {
            if (e.target && (e.target.tagName === 'BUTTON' || e.target.closest('button'))) {
                const btn = e.target.tagName === 'BUTTON' ? e.target : e.target.closest('button');
                btn.blur();
                window.focus();
            }
        });

        // Falling Sakura Petals Animation
        const totalLeaves = 12;
        const container = document.getElementById('soloLeavesContainer');
        for (let i = 0; i < totalLeaves; i++) {
            const xVal = ((i * 53) % 94) + 3;
            const delayVal = ((i * 1.61) % 12).toFixed(2);
            const durVal = (10 + ((i * 2.7) % 9)).toFixed(2);
            const driftVal = ((i % 2 === 0 ? 1 : -1) * (15 + (i * 4) % 25)).toFixed(0);
            const sizeVal = 9 + (i % 4) * 3;
            const rotStartVal = (i * 61) % 360;

            const petal = document.createElement('span');
            petal.className = 'sakura-petal';
            petal.style.left = xVal + 'vw';
            petal.style.width = sizeVal + 'px';
            petal.style.height = sizeVal + 'px';
            petal.style.animationDelay = '-' + delayVal + 's';
            petal.style.animationDuration = durVal + 's';
            petal.style.setProperty('--drift', driftVal + 'px');
            petal.style.setProperty('--rot-start', rotStartVal + 'deg');
            petal.innerHTML = `<svg viewBox="0 0 16 16" shapeRendering="crispEdges" width="100%" height="100%"><rect x="4" y="2" width="8" height="2" fill="#ffd1de" /><rect x="2" y="4" width="12" height="2" fill="#ffbccc" /><rect x="2" y="6" width="12" height="4" fill="#ff9ebb" /><rect x="4" y="10" width="8" height="2" fill="#f28da9" /><rect x="6" y="12" width="4" height="2" fill="#e07392" /></svg>`;
            container.appendChild(petal);
        }

        // Wordle Feedback Evaluator
        function evaluateFeedback(guess, target) {
            let feedback = new Array(target.length).fill('absent');
            let targetArr = target.split('');
            let guessArr = guess.split('');

            for (let i = 0; i < target.length; i++) {
                if (guessArr[i] === targetArr[i]) {
                    feedback[i] = 'correct';
                    targetArr[i] = null;
                    guessArr[i] = null;
                }
            }
            for (let i = 0; i < target.length; i++) {
                if (guessArr[i] !== null) {
                    let idx = targetArr.indexOf(guessArr[i]);
                    if (idx !== -1) {
                        feedback[i] = 'present';
                        targetArr[idx] = null;
                    }
                }
            }
            return feedback;
        }

        // Non-blocking background score fetch (doesn't delay the grid)
        function fetchUserScore() {
            fetch('/api/user/rank')
                .then(res => res.json())
                .then(data => {
                    if (data && data.score !== undefined) {
                        currentUserScore = data.score;
                        const badge = document.getElementById('userScoreBadge');
                        if (badge) badge.innerText = `${currentUserScore} PTS`;
                    }
                })
                .catch(() => { });
        }

        async function loadDictionary() {
            if (cachedDictionary) return cachedDictionary;
            try {
                const res = await fetch('minele_data.json');
                cachedDictionary = await res.json();
                return cachedDictionary;
            } catch (e) {
                return null;
            }
        }

        // 🟢 INSTANT 0MS INITIALIZATION: Renders saved state immediately with zero network delay
        function initGame() {
            // Step 1: Draw saved game from localStorage instantly
            const savedRaw = localStorage.getItem(LOCAL_STORAGE_KEY);
            let hasActiveState = false;

            if (savedRaw) {
                try {
                    gameState = JSON.parse(savedRaw);
                    if (gameState && gameState.targetWord) {
                        rehydrateBoard();
                        hasActiveState = true;
                    }
                } catch (e) {
                    localStorage.removeItem(LOCAL_STORAGE_KEY);
                }
            }

            // Step 2: Fetch score in background (never blocks the grid)
            fetchUserScore();

            // Step 3: Load dictionary in background; pick new word only if no saved game exists
            loadDictionary().then(dict => {
                if (!dict) return;
                if (!hasActiveState || !gameState.targetWord) {
                    pickNewWord(dict);
                }
            });
        }

        function pickNewWord(dict) {
            const categories = Object.keys(dict).filter(k => Array.isArray(dict[k]) && dict[k].length > 0);
            const randomCategory = categories[Math.floor(Math.random() * categories.length)];
            const wordList = dict[randomCategory];
            const rawTarget = wordList[Math.floor(Math.random() * wordList.length)];

            const target = rawTarget.trim().toUpperCase();
            const len = target.length;
            const attempts = (len === 3) ? 4 : len;

            gameState = {
                targetWord: target,
                wordLength: len,
                totalAttempts: attempts,
                currentRow: 0,
                currentInput: "",
                attempts: [],
                isCompleted: false,
                isWon: false,
                pointsAwarded: false
            };

            saveGameState();
            buildGrid();
            updateAttemptCounter();
            hideResultBanner();
        }

        function saveGameState() {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(gameState));
        }

        function buildGrid() {
            const grid = document.getElementById('wordleGridBox');
            if (!grid) return;
            grid.innerHTML = "";
            for (let r = 0; r < gameState.totalAttempts; r++) {
                const row = document.createElement('div');
                row.className = "wordle-row";
                row.id = `row-${r}`;
                for (let c = 0; c < gameState.wordLength; c++) {
                    const cell = document.createElement('div');
                    cell.className = "wordle-cell";
                    cell.id = `cell-${r}-${c}`;
                    row.appendChild(cell);
                }
                grid.appendChild(row);
            }
        }

        function updateAttemptCounter() {
            const el = document.getElementById('attemptCounterText');
            if (el) {
                el.innerText = `ATTEMPT ${Math.min(gameState.currentRow + 1, gameState.totalAttempts)} / ${gameState.totalAttempts}`;
            }
        }

        function rehydrateBoard() {
            buildGrid();
            gameState.attempts.forEach((att, rIdx) => {
                for (let c = 0; c < gameState.wordLength; c++) {
                    const cell = document.getElementById(`cell-${rIdx}-${c}`);
                    if (cell) {
                        cell.innerText = att.guess[c] || "";
                        cell.classList.add(att.feedback[c]);
                    }
                }
            });

            updateAttemptCounter();

            if (gameState.isCompleted) {
                showResultBanner(gameState.isWon, false, 0);
            } else {
                hideResultBanner();
            }
        }

        function updateCurrentRowCells() {
            for (let c = 0; c < gameState.wordLength; c++) {
                const cell = document.getElementById(`cell-${gameState.currentRow}-${c}`);
                if (cell) {
                    cell.innerText = gameState.currentInput[c] || "";
                }
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toastNotice');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 1800);
        }

        async function submitGuess() {
            if (gameState.isCompleted) return;

            if (gameState.currentInput.length !== gameState.wordLength) {
                showToast(`Word must be ${gameState.wordLength} letters`);
                const row = document.getElementById(`row-${gameState.currentRow}`);
                if (row) {
                    row.classList.add('shake-row');
                    setTimeout(() => row.classList.remove('shake-row'), 400);
                }
                return;
            }

            const guess = gameState.currentInput.toUpperCase();
            const dict = await loadDictionary();
            const categoryKey = `${gameState.wordLength}_characters`;
            const validWords = (dict && dict[categoryKey]) ? dict[categoryKey] : [];

            const isValid = validWords.some(w => w.trim().toUpperCase() === guess);
            if (!isValid) {
                showToast("Invalid Word");
                const row = document.getElementById(`row-${gameState.currentRow}`);
                if (row) {
                    row.classList.add('shake-row');
                    setTimeout(() => row.classList.remove('shake-row'), 400);
                }
                return;
            }

            const feedback = evaluateFeedback(guess, gameState.targetWord);

            for (let c = 0; c < gameState.wordLength; c++) {
                const cell = document.getElementById(`cell-${gameState.currentRow}-${c}`);
                if (cell) cell.classList.add(feedback[c]);
            }

            gameState.attempts.push({ guess: guess, feedback: feedback });

            // 🟢 INSTANT 0MS VICTORY DISPLAY
            if (guess === gameState.targetWord) {
                gameState.isCompleted = true;
                gameState.isWon = true;

                // 1. Calculate streak locally in 0ms (zero wait)
                let currentStreak = parseInt(localStorage.getItem(STREAK_KEY) || "0") + 1;
                let bonusEarned = (currentStreak % 5 === 0) ? 500 : 0;

                saveGameState();

                // 2. Pop up victory banner instantly!
                showResultBanner(true, true, bonusEarned);

                // 3. Sync score in background without blocking UI
                syncPointsToDatabase(currentStreak, bonusEarned);
                return;
            }

            // Loss Condition
            gameState.currentRow++;
            gameState.currentInput = "";
            saveGameState();
            updateAttemptCounter();

            if (gameState.currentRow >= gameState.totalAttempts) {
                gameState.isCompleted = true;
                gameState.isWon = false;
                saveGameState();
                localStorage.setItem(STREAK_KEY, "0");
                showResultBanner(false, false, 0);
            }
        }

        // Non-blocking background score update
        async function syncPointsToDatabase(currentStreak, bonusEarned) {
            if (gameState.pointsAwarded) return;
            localStorage.setItem(STREAK_KEY, String(currentStreak));

            let pointsToGive = 100 + bonusEarned;

            try {
                const res = await fetch('/api/score/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pointsToAdd: pointsToGive })
                });
                if (res.ok) {
                    gameState.pointsAwarded = true;
                    saveGameState();
                    fetchUserScore();
                }
            } catch (e) { }
        }

        function showResultBanner(isWon, isNewSolve, bonusEarned) {
            const banner = document.getElementById('resultBanner');
            const headline = document.getElementById('resultHeadline');
            const detail = document.getElementById('resultDetail');
            const nextBtn = document.getElementById('nextWordBtn');
            const underAction = document.getElementById('underGridActionBox');

            if (underAction) underAction.style.display = 'none';

            banner.className = `result-banner-box ${isWon ? 'win' : 'loss'}`;
            banner.style.display = 'block';

            if (isWon) {
                headline.innerText = bonusEarned > 0 ? "★ STREAK MASTER: +500 BONUS! ★" : "✦ OUTSTANDING DECODE ✦";
                headline.style.color = "var(--diamond)";
                detail.innerText = isNewSolve
                    ? (bonusEarned > 0 ? `You gained +100 points AND a +500 streak bonus!` : `You gained +100 points!`)
                    : `Solved! Target was: ${gameState.targetWord}`;
                nextBtn.innerText = "Next Word →";
            } else {
                headline.innerText = "OUT OF ATTEMPTS";
                headline.style.color = "var(--redstone)";
                detail.innerText = `The item was: ${gameState.targetWord}`;
                nextBtn.innerText = "Try Another Word →";
            }
        }

        function hideResultBanner() {
            document.getElementById('resultBanner').style.display = 'none';
            const underAction = document.getElementById('underGridActionBox');
            if (underAction) underAction.style.display = 'block';
        }

        function pickNextWordDirect() {
            if (document.activeElement && typeof document.activeElement.blur === 'function') {
                document.activeElement.blur();
            }
            window.focus();

            localStorage.removeItem(LOCAL_STORAGE_KEY);
            hideResultBanner();
            loadDictionary().then(dict => {
                if (dict) pickNewWord(dict);
            });
        }

        window.addEventListener('keydown', (e) => {
            if (document.activeElement && document.activeElement.tagName === 'BUTTON') {
                document.activeElement.blur();
                window.focus();
            }

            if (gameState.isCompleted) {
                if (e.key === 'Enter') pickNextWordDirect();
                return;
            }

            if (e.key === 'Enter') {
                e.preventDefault();
                submitGuess();
            } else if (e.key === 'Backspace') {
                if (gameState.currentInput.length > 0) {
                    gameState.currentInput = gameState.currentInput.slice(0, -1);
                    updateCurrentRowCells();
                }
            } else if (/^[a-zA-Z]$/.test(e.key)) {
                if (gameState.currentInput.length < gameState.wordLength) {
                    gameState.currentInput += e.key.toUpperCase();
                    updateCurrentRowCells();
                }
            }
        });

        // Initialize as soon as DOM is parsed
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGame);
        } else {
            initGame();
        }
    </script>
</body>
</html>
